<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="X Pay">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#91D41E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#050805" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4FF5A"/>
      <stop offset="50%" stop-color="#A8EC2A"/>
      <stop offset="100%" stop-color="#7BC412"/>
    </linearGradient>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C9C9C9"/>
    </linearGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="#050805"/>
  <circle cx="200" cy="200" r="140" fill="url(#glow)"/>
  <g filter="url(#sh)" transform="translate(200 200)">
    <!-- TL white -->
    <rect x="-118" y="-24" width="100" height="48" rx="24" fill="url(#w)" transform="rotate(-45)"/>
    <!-- BR white -->
    <rect x="18" y="-24" width="100" height="48" rx="24" fill="url(#w)" transform="rotate(-45)"/>
    <!-- TR green -->
    <rect x="18" y="-24" width="100" height="48" rx="24" fill="url(#g)" transform="rotate(45)"/>
    <!-- BL green -->
    <rect x="-118" y="-24" width="100" height="48" rx="24" fill="url(#g)" transform="rotate(45)"/>
  </g>
</svg>
