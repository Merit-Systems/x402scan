name: Deploy Alerts to Trigger.dev (prod)

on:
  push:
    branches:
      - main
    paths:
      - "sync/alerts/**"
      - "packages/external/facilitators/**"
      - "package.json"
      - ".node-version"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "foundation.config.ts"
      - "turbo.json"
      - ".github/workflows/deploy-alerts.yml"

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy Alerts to Trigger.dev
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          registry-url: "https://npm.pkg.github.com"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm install --frozen-lockfile --filter "@x402scan/sync-alerts..."

      - name: Deploy to Trigger.dev
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        run: pnpm trigger:deploy:alerts
