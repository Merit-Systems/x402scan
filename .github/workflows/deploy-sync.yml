name: Deploy Sync (Transfers) to Trigger.dev (prod)

on:
  push:
    branches:
      - main
    paths:
      - "sync/transfers/**"
      - "packages/external/facilitators/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-sync.yml"

jobs:
  deploy:
    name: Deploy Transfers to Trigger.dev
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@20
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@x402scan/sync-transfers..."

      - name: Deploy to Trigger.dev
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        run: pnpm trigger:deploy:transfers
