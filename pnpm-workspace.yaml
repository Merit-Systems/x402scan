packages:
  - "apps/**"
  - "sync/*"
  - "configurations/*"
  - "packages/**"

catalog:
  "@types/node": ^20.19.27
  date-fns: 4.1.0
  bs58: ^6.0.0
  lucide-react: ^1.34.0
  motion: ^13.1.1
  server-only: ^0.0.1
  superjson: ^2.2.6
  typescript: ^6.0.3
  zod: ^4.4.3
  tsx: ^4.21.0
  tsup: ^8.5.1
  viem: ^2.47.0
  "@signinwithethereum/siwe": ^4.1.0
  vitest: ^4.0.16
  rimraf: ^5.0.5
  oxfmt: ^0.64.0
  oxlint: 1.78.0
  oxlint-tsgolint: 7.0.2001
  portless: 0.15.6

catalogs:
  foundation:
    "@merit-systems/foundation": 0.20.2
    "@merit-systems/oxfmt-config": 0.20.2
    "@merit-systems/oxlint-config": 0.20.2
    "@merit-systems/taze-config": 0.20.2
    "@merit-systems/tsdown-config": 0.20.2
    "@merit-systems/typescript-config": 0.20.2
  bundling:
    tsdown: 0.22.14
  env:
    "@t3-oss/env-core": ^0.13.10
    "@t3-oss/env-nextjs": ^0.13.10
    dotenv: ^17.2.3
  next:
    next: &NEXT_VERSION ^16.1.5
    "@next/mdx": *NEXT_VERSION
    next-themes: ^0.4.6
  prisma:
    prisma: &PRISMA_VERSION ^7.3.0
    "@prisma/client": ^7.3.0
    "@prisma/adapter-neon": ^7.3.0
    ws: ^8.18.3
    "@types/ws": ^8.18.1
    "@neondatabase/serverless": ^1.0.2
  react:
    "@types/react": &REACT_VERSION 19.2.2
    "@types/react-dom": 19.2.2
    react: 19.2.2
    react-dom: 19.2.2
    react-error-boundary: ^6.0.2
  coinbase:
    "@coinbase/cdp-core": &CDP_CORE_VERSION ^0.0.74
    "@coinbase/cdp-hooks": ^0.0.74
    "@coinbase/cdp-solana-standard-wallet": ^0.0.74
    "@coinbase/cdp-wagmi": ^0.0.74
    "@coinbase/cdp-sdk": ^1.40.1
  solana:
    "@solana/kit": &SOLANA_VERSION ^5.0.0
    "@solana/react": ^5.0.0
    "@solana/transaction-messages": ^5.0.0
    "@solana/transactions": ^5.0.0
  trpc:
    "@trpc/client": &TRPC_VERSION ^11.8.1
    "@trpc/react-query": ^11.8.1
    "@trpc/server": ^11.8.1
  x402:
    "@x402/core": &X402_CORE_VERSION ^2.11.0
    "@x402/evm": ^2.11.0
    "@x402/fetch": ^2.11.0
    "@x402/svm": ^2.11.0
  tailwind:
    "@tailwindcss/postcss": &TAILWIND_VERSION ^4
    tailwindcss: ^4
  hono:
    "@hono/node-server": ^1.19.9
    hono: ^4.12.28
  clickhouse:
    "@clickhouse/client": ^1.12.1
  react-query:
    "@tanstack/react-query": ^5.90.16
    "@tanstack/react-query-devtools": ^5.91.2
  trigger:
    "@trigger.dev/sdk": &TRIGGER_SDK_VERSION ^4.3.2
    "@trigger.dev/build": ^4.3.2
    trigger.dev: ^4.3.2
overrides:
  "@types/react": 19.2.2
  "@types/react-dom": 19.2.2
  "@auth/core": 0.40.0
  "react": 19.2.2
  "react-dom": 19.2.2
  "viem": 2.51.2
  "@walletconnect/utils": ^2.23.9

# Postinstall/build scripts: only @coinbase/x402 may run them; the rest were
# silently skipped under pnpm 10 and stay disabled to keep behavior identical.
allowBuilds:
  "@coinbase/x402": true
  "@depot/cli": false
  "@posthog/cli": false
  "@prisma/engines": false
  "@swc/core": false
  "@vercel/speed-insights": false
  "better-sqlite3": false
  "bigint-buffer": false
  "bufferutil": false
  "core-js": false
  "esbuild": false
  "keccak": false
  "prisma": false
  "protobufjs": false
  "sharp": false
  "utf-8-validate": false
  "workerd": false

minimumReleaseAgeExclude:
  - "@merit-systems/*"
